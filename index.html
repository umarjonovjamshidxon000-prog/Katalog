<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malika Print — Katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --accent:#e6007e;
    --accent-text:#ffffff;
    --fb-bg:#f3f3f7; --fb-card:#ffffff; --fb-text:#15151b; --fb-hint:#8b8b97; --fb-sec:#e9e9f0;
    --bg:var(--tg-theme-bg-color,var(--fb-bg));
    --card:var(--tg-theme-section-bg-color,var(--fb-card));
    --text:var(--tg-theme-text-color,var(--fb-text));
    --hint:var(--tg-theme-hint-color,var(--fb-hint));
    --sec:var(--tg-theme-secondary-bg-color,var(--fb-sec));
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --fb-bg:#111116; --fb-card:#1c1c24; --fb-text:#f1f1f5; --fb-hint:#8d8d9a; --fb-sec:#26262f; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--sec);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  body{min-height:100vh;padding-bottom:90px}
  button,input,textarea,select{font:inherit;color:inherit}

  /* Sarlavha */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 16px 10px;background:var(--bg)}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
    font-weight:800;letter-spacing:.5px;color:#fff;
    background:linear-gradient(135deg,#00a0e3 0%,#e6007e 55%,#ffd400 100%)}
  .brand h1{margin:0;font-size:19px;line-height:1.2}
  .brand p{margin:2px 0 0;font-size:13px;color:var(--hint)}
  .badge{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;
    background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap}

  .search{padding:4px 16px 10px;background:var(--bg)}
  .search input{width:100%;border:0;outline:0;border-radius:12px;padding:11px 14px;
    background:var(--sec);font-size:15px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px;background:var(--bg);
    scrollbar-width:none;border-radius:0 0 20px 20px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:0;cursor:pointer;padding:8px 14px;border-radius:999px;
    background:var(--sec);font-size:14px;font-weight:500}
  .chip.on{background:var(--accent);color:var(--accent-text)}

  /* Kartochkalar */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;padding:14px 16px}
  .card{position:relative;background:var(--card);border-radius:var(--radius);overflow:hidden;
    cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
  .card:active{transform:scale(.97)}
  .thumb{aspect-ratio:1/1;width:100%;object-fit:cover;display:block;background:var(--sec)}
  .ph{aspect-ratio:1/1;display:grid;place-items:center;font-size:42px;font-weight:800;color:#fff}
  .card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
  .card .cat{font-size:11.5px;color:var(--hint)}
  .card .name{font-size:15px;font-weight:600;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .price{margin-top:auto;font-size:14px;font-weight:700;color:var(--accent)}
  .edit-btn{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;
    background:rgba(0,0,0,.55);color:#fff;font-size:15px;cursor:pointer;display:grid;place-items:center}
  .skeleton{background:var(--card);border-radius:var(--radius);aspect-ratio:3/4;
    animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.5}}
  .empty{text-align:center;color:var(--hint);padding:50px 24px;font-size:15px}

  .contact{margin:6px 16px 0;background:var(--card);border-radius:var(--radius);padding:14px;
    display:flex;gap:10px}
  .btn{flex:1;border:0;cursor:pointer;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:600;
    text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn.primary{background:var(--accent);color:var(--accent-text)}
  .btn.ghost{background:var(--sec);color:var(--text)}
  .btn.danger{background:color-mix(in srgb,#e5484d 14%,transparent);color:#e5484d}
  .btn:disabled{opacity:.55;cursor:default}

  .fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;
    border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;cursor:pointer;
    box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent);z-index:20}

  /* Pastdan chiqadigan oyna */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;
    align-items:flex-end;justify-content:center;animation:fade .18s}
  .overlay[hidden]{display:none}
  .sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);
    border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    animation:up .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.4}}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--hint);opacity:.4;margin:0 auto 12px}
  .detail-img{width:100%;border-radius:var(--radius);display:block;max-height:52vh;object-fit:contain;background:var(--sec)}
  .detail-img.ph{max-height:none;font-size:72px}
  .sheet h2{margin:14px 0 4px;font-size:21px;line-height:1.25}
  .sheet .cat{color:var(--hint);font-size:13px;margin-top:14px}
  .sheet .price{color:var(--accent);font-size:18px;font-weight:700;margin:6px 0 10px}
  .desc{white-space:pre-wrap;line-height:1.5;font-size:15px;margin:0 0 16px}
  .row{display:flex;gap:10px;margin-top:12px}

  /* Forma */
  .field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .field label{font-size:13px;color:var(--hint);font-weight:500}
  .field input,.field textarea{border:0;outline:0;border-radius:12px;padding:12px 14px;background:var(--sec);font-size:15px;width:100%}
  .field textarea{min-height:96px;resize:vertical}
  .imgpick{display:flex;align-items:center;gap:12px}
  .imgpick .prev{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--sec);flex:none;
    display:grid;place-items:center;color:var(--hint);font-size:26px}
  .imgpick label.btn{flex:none;padding:10px 14px}
  .note{font-size:12.5px;color:var(--hint);margin-top:10px;line-height:1.45}

  .toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;
    transition:.2s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">MP</div>
    <div>
      <h1 id="shopName">Malika Print</h1>
      <p>Reklama mahsulotlari katalogi</p>
    </div>
  </div>
  <span id="modeBadge" class="badge" hidden></span>
</header>
<div class="search"><input id="q" type="search" placeholder="Mahsulot qidirish…" autocomplete="off"></div>
<nav id="chips" class="chips"></nav>

<main id="grid" class="grid"></main>
<div id="empty" class="empty" hidden></div>

<section class="contact">
  <a id="tgLink" class="btn primary" href="#">✈️ Telegramda yozish</a>
  <a id="phoneLink" class="btn ghost" href="#">📞 Qoʻngʻiroq</a>
</section>

<button id="fab" class="fab" hidden aria-label="Mahsulot qoʻshish">+</button>
<div id="overlay" class="overlay" hidden><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   SOZLAMALAR — faqat shu qismni o'zgartirasiz
   ============================================================ */
const CONFIG = {
  SHOP_NAME: "Malika Print",
  CONTACT_USERNAME: "Marketmalika",          // buyurtma yoziladigan Telegram akkaunt (@ belgisisiz)
  PHONE: "+998774157278",
  ADMIN_TELEGRAM_IDS: [],               // sizning Telegram ID raqamingiz, masalan: [123456789]
  SUPABASE_URL: "https://bnvomypnvqmocoxcwhlu.supabase.co",                     // masalan: "https://abcd1234.supabase.co"
  SUPABASE_ANON_KEY: "sb_publishable_fF0DcDvOXjkHQ40iJocMJg_vsc4qNUy",                // Supabase → Project Settings → API → anon public key
  BUCKET: "products",
};
/* ============================================================ */

const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined
  ? window.Telegram.WebApp : null;
const inTelegram = !!(tg && tg.initData);
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const tgUser = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const params = new URLSearchParams(location.search);
// Tahrirlash tugmalari faqat admin uchun ko'rinadi. ?admin=1 — kompyuter brauzerida sinash uchun.
// Haqiqiy himoya: Supabase'ga yozish uchun parol bilan kirish shart.
const IS_ADMIN = (tgUser && CONFIG.ADMIN_TELEGRAM_IDS.includes(tgUser.id)) || params.has("admin");

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || "light"); } catch(e){} };

function toast(msg, ms = 2400){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), ms);
}
function askConfirm(msg){
  return new Promise(res => {
    try {
      if (inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) return tg.showConfirm(msg, ok => res(!!ok));
    } catch(e){}
    res(window.confirm(msg));
  });
}
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res;
    s.onerror = () => rej(new Error("Kutubxona yuklanmadi: " + src)); document.head.appendChild(s);
  });
}
function colorFor(str){
  const pal = ["#e6007e","#00a0e3","#7c3aed","#f59e0b","#10b981","#ef4444","#0ea5e9","#d946ef"];
  let h = 0; for (const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const a = pal[h % pal.length], b = pal[(h >> 3) % pal.length];
  return `linear-gradient(135deg, ${a}, ${b === a ? "#222" : b})`;
}
function compressImage(file, max = 1280, q = 0.85){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("Rasmni oʻqib boʻlmadi")), "image/jpeg", q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Bu rasm formati qoʻllab-quvvatlanmaydi")); };
    img.src = url;
  });
}
const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

/* ---------------- Ma'lumotlar ombori ---------------- */
const SAMPLE = [
  {name:"Banner bosma (Frontlit)", category:"Bannerlar", price:"35 000 soʻm / m²", description:"Koʻcha uchun mustahkam banner. Lyuvers (halqa) bilan yoki ramkaga tortib beriladi.\nRuxsat: 720 dpi."},
  {name:"Roll-up stend 85×200", category:"Stendlar", price:"280 000 soʻm", description:"Koʻchma stend, sumkasi bilan. Koʻrgazma va doʻkon ichi uchun."},
  {name:"Vizitka (100 dona)", category:"Poligrafiya", price:"60 000 soʻmdan", description:"350 g qogʻoz, ikki tomonlama, laminatsiya ixtiyoriy."},
  {name:"Flayer A5", category:"Poligrafiya", price:"Kelishilgan holda", description:"Aksiya va reklama uchun varaqalar. Adadga qarab narx."},
  {name:"Oracal stiker", category:"Stikerlar", price:"45 000 soʻm / m²", description:"Oyna, mashina va vitrina uchun. Kesib (plotter) beriladi."},
  {name:"Lightbox (yorugʻlik qutisi)", category:"Vivyeskalar", price:"Kelishilgan holda", description:"Doʻkon peshtoqi uchun LED yoritgichli quti."},
  {name:"Krujkaga rasm bosish", category:"Suvenirlar", price:"40 000 soʻm", description:"Oq krujka, istalgan rasm yoki logotip."},
];

const DemoStore = {
  key: "mp_demo_products", mem: null,
  read(){ if (this.mem) return this.mem;
    try { const v = localStorage.getItem(this.key); if (v) return (this.mem = JSON.parse(v)); } catch(e){}
    return (this.mem = SAMPLE.map((p,i) => ({...p, id: i+1, image_url: "", created_at: new Date(Date.now()-i*1000).toISOString()})));
  },
  write(list){ this.mem = list; try { localStorage.setItem(this.key, JSON.stringify(list)); } catch(e){ toast("Demo: rasm katta, faqat shu oynada saqlandi"); } },
  async list(){ return [...this.read()].sort((a,b) => b.created_at.localeCompare(a.created_at)); },
  async save(p, blob){
    const list = this.read();
    if (blob) p.image_url = await blobToDataURL(blob);
    if (p.id){ const i = list.findIndex(x => x.id === p.id); list[i] = {...list[i], ...p}; }
    else list.push({...p, id: Date.now(), created_at: new Date().toISOString()});
    this.write(list);
  },
  async remove(id){ this.write(this.read().filter(x => x.id !== id)); },
  async ensureAuth(){ return true; },
};

let sb = null;
const SupaStore = {
  initError: null,
  async init(){
    // Manzilni tozalash: oxiridagi "/" yoki "/rest/v1" ni olib tashlaymiz
    const url = String(CONFIG.SUPABASE_URL).trim().replace(/\/rest\/v1\/?$/, "").replace(/\/+$/, "");
    const key = String(CONFIG.SUPABASE_ANON_KEY).trim();
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))
      throw new Error(`SUPABASE_URL notoʻgʻri: "${url}". Toʻgʻri koʻrinishi: https://xxxx.supabase.co`);
    if (key.length < 30)
      throw new Error("SUPABASE_ANON_KEY toʻliq emas — kalitni oxirigacha nusxalang.");
    // Kutubxonani yuklash: birinchi manzil ochilmasa, zaxirasidan
    const cdns = ["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
                  "https://unpkg.com/@supabase/supabase-js@2"];
    for (const src of cdns){
      if (window.supabase && window.supabase.createClient) break;
      try { await loadScript(src); } catch(e){ console.warn(e); }
    }
    if (!(window.supabase && window.supabase.createClient))
      throw new Error("Supabase kutubxonasi yuklanmadi. Internetni tekshirib, katalogni qayta oching.");
    sb = window.supabase.createClient(url, key);
  },
  async list(){
    const { data, error } = await sb.from("products").select("*").order("created_at", { ascending: false });
    if (error) throw error; return data || [];
  },
  async uploadImage(blob){
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const { error } = await sb.storage.from(CONFIG.BUCKET).upload(path, blob, { contentType: "image/jpeg" });
    if (error) throw error;
    return sb.storage.from(CONFIG.BUCKET).getPublicUrl(path).data.publicUrl;
  },
  pathFromUrl(url){ const m = String(url||"").split(`/object/public/${CONFIG.BUCKET}/`)[1]; return m ? decodeURIComponent(m) : null; },
  async save(p, blob){
    const oldUrl = p._oldImage; delete p._oldImage;
    if (blob) p.image_url = await this.uploadImage(blob);
    const row = { name: p.name, category: p.category, price: p.price, description: p.description, image_url: p.image_url || null };
    const q = p.id ? sb.from("products").update(row).eq("id", p.id) : sb.from("products").insert(row);
    const { error } = await q; if (error) throw error;
    if (blob && oldUrl){ const op = this.pathFromUrl(oldUrl); if (op) sb.storage.from(CONFIG.BUCKET).remove([op]).catch(()=>{}); }
  },
  async remove(id, imageUrl){
    const { error } = await sb.from("products").delete().eq("id", id); if (error) throw error;
    const op = this.pathFromUrl(imageUrl); if (op) sb.storage.from(CONFIG.BUCKET).remove([op]).catch(()=>{});
  },
  async ensureAuth(){
    if (!sb) throw new Error(this.initError || "Bazaga ulanib boʻlmadi. Katalogni yopib, qayta oching.");
    const { data } = await sb.auth.getSession();
    if (data && data.session) return true;
    return openLogin();
  },
};
const store = DEMO ? DemoStore : SupaStore;

/* ---------------- Holat va chizish ---------------- */
let products = [], activeCat = "Barchasi", query = "";

function imageHTML(p, cls){
  return p.image_url
    ? `<img class="${cls}" src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`
    : `<div class="${cls} ph" style="background:${colorFor(p.category + p.name)}">${esc((p.name||"?").trim().charAt(0).toUpperCase())}</div>`;
}
function renderChips(){
  const cats = ["Barchasi", ...[...new Set(products.map(p => p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b))];
  if (!cats.includes(activeCat)) activeCat = "Barchasi";
  $("#chips").innerHTML = cats.map(c => `<button class="chip ${c===activeCat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
function render(){
  renderChips();
  const q = query.trim().toLowerCase();
  const list = products.filter(p =>
    (activeCat === "Barchasi" || p.category === activeCat) &&
    (!q || (p.name + " " + (p.description||"") + " " + p.category).toLowerCase().includes(q)));
  $("#grid").innerHTML = list.map(p => `
    <article class="card" data-id="${p.id}">
      ${imageHTML(p, "thumb")}
      ${IS_ADMIN ? `<button class="edit-btn" data-edit="${p.id}" aria-label="Tahrirlash">✏️</button>` : ""}
      <div class="body">
        <div class="cat">${esc(p.category)}</div>
        <div class="name">${esc(p.name)}</div>
        ${p.price ? `<div class="price">${esc(p.price)}</div>` : ""}
      </div>
    </article>`).join("");
  const empty = $("#empty");
  empty.hidden = list.length > 0;
  empty.textContent = products.length === 0
    ? (IS_ADMIN ? "Katalog hozircha boʻsh. Pastdagi “+” tugmasi bilan birinchi mahsulotni qoʻshing." : "Katalog tez orada toʻldiriladi.")
    : "Hech narsa topilmadi.";
}
async function reload(){
  $("#grid").innerHTML = Array.from({length:6}, () => `<div class="skeleton"></div>`).join("");
  try { products = await store.list(); }
  catch(e){ console.error(e); products = []; toast("Katalogni yuklab boʻlmadi: " + (e.message || e), 4000); }
  render();
}

/* ---------------- Oynalar ---------------- */
let onSheetClose = null;
function openSheet(html, onClose){
  $("#sheet").innerHTML = `<div class="grab"></div>` + html;
  $("#overlay").hidden = false; document.body.style.overflow = "hidden";
  onSheetClose = onClose || null;
  if (inTelegram) try { tg.BackButton.show(); } catch(e){}
}
function closeSheet(){
  if ($("#overlay").hidden) return;
  $("#overlay").hidden = true; document.body.style.overflow = "";
  if (inTelegram) try { tg.BackButton.hide(); } catch(e){}
  const cb = onSheetClose; onSheetClose = null; cb && cb();
}
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeSheet(); });
if (inTelegram) try { tg.BackButton.onClick(closeSheet); } catch(e){}

function openChat(text){
  const url = `https://t.me/${CONFIG.CONTACT_USERNAME}` + (text ? `?text=${encodeURIComponent(text)}` : "");
  if (inTelegram) try { return tg.openTelegramLink(url); } catch(e){}
  window.open(url, "_blank");
}

function openDetail(p){
  openSheet(`
    ${imageHTML(p, "detail-img")}
    <div class="cat">${esc(p.category)}</div>
    <h2>${esc(p.name)}</h2>
    ${p.price ? `<div class="price">${esc(p.price)}</div>` : ""}
    ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ""}
    <div class="row">
      <button class="btn primary" id="dOrder">✈️ Buyurtma berish</button>
      <a class="btn ghost" href="tel:${esc(CONFIG.PHONE)}">📞</a>
    </div>
    ${IS_ADMIN ? `<div class="row"><button class="btn ghost" id="dEdit">✏️ Tahrirlash</button></div>` : ""}
  `);
  $("#dOrder").onclick = () => { haptic(); openChat(`Assalomu alaykum! "${p.name}" boʻyicha maʼlumot olmoqchi edim.`); };
  if (IS_ADMIN) $("#dEdit").onclick = () => startEdit(p);
}

async function startEdit(p){
  try { if (!(await store.ensureAuth())) return; } catch(e){ return toast(e.message || "Kirishda xato"); }
  openForm(p);
}

function openForm(p){
  const isNew = !p; p = p ? {...p} : { name:"", category:"", price:"", description:"", image_url:"" };
  const cats = [...new Set(products.map(x => x.category).filter(Boolean))];
  let pickedBlob = null;
  openSheet(`
    <h2>${isNew ? "Yangi mahsulot" : "Mahsulotni tahrirlash"}</h2>
    <div class="field"><label>Rasm</label>
      <div class="imgpick">
        ${p.image_url ? `<img class="prev" id="fPrev" src="${esc(p.image_url)}">` : `<div class="prev" id="fPrev">🖼</div>`}
        <label class="btn ghost">📷 Rasm tanlash<input id="fFile" type="file" accept="image/*" hidden></label>
      </div></div>
    <div class="field"><label for="fName">Nomi *</label><input id="fName" maxlength="120" value="${esc(p.name)}" placeholder="Masalan: Banner bosma"></div>
    <div class="field"><label for="fCat">Boʻlim (kategoriya) *</label>
      <input id="fCat" list="catList" maxlength="40" value="${esc(p.category)}" placeholder="Masalan: Bannerlar">
      <datalist id="catList">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
    <div class="field"><label for="fPrice">Narxi</label><input id="fPrice" maxlength="60" value="${esc(p.price)}" placeholder="Masalan: 35 000 soʻm / m²  yoki  Kelishilgan holda"></div>
    <div class="field"><label for="fDesc">Tavsif</label><textarea id="fDesc" maxlength="1500" placeholder="Material, oʻlcham, muddat…">${esc(p.description)}</textarea></div>
    <div class="row"><button class="btn primary" id="fSave">💾 Saqlash</button></div>
    ${isNew ? "" : `<div class="row"><button class="btn danger" id="fDel">🗑 Oʻchirish</button></div>`}
    ${DEMO ? `<p class="note">Demo rejim: oʻzgarishlar faqat shu qurilmada saqlanadi. Supabase ulangandan keyin hamma mijozlar koʻradi.</p>` : ""}
  `);
  $("#fFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      pickedBlob = await compressImage(f);
      const prev = $("#fPrev"), url = URL.createObjectURL(pickedBlob);
      if (prev.tagName === "IMG") prev.src = url;
      else prev.outerHTML = `<img class="prev" id="fPrev" src="${url}">`;
    } catch(err){ toast(err.message); }
  };
  $("#fSave").onclick = async () => {
    const name = $("#fName").value.trim(), category = $("#fCat").value.trim();
    if (!name) return toast("Mahsulot nomini kiriting");
    if (!category) return toast("Boʻlimni kiriting");
    const btn = $("#fSave"); btn.disabled = true; btn.textContent = "Saqlanmoqda…";
    try {
      await store.save({ id: p.id, name, category, price: $("#fPrice").value.trim(),
        description: $("#fDesc").value.trim(), image_url: p.image_url, _oldImage: p.image_url }, pickedBlob);
      haptic("medium"); closeSheet(); toast(isNew ? "Mahsulot qoʻshildi ✅" : "Saqlandi ✅"); reload();
    } catch(e){
      console.error(e); btn.disabled = false; btn.textContent = "💾 Saqlash";
      toast(/row-level|permission|JWT|401|403/i.test(e.message||"") ? "Ruxsat yoʻq — admin sifatida qayta kiring" : "Xato: " + (e.message || e), 4000);
    }
  };
  if (!isNew) $("#fDel").onclick = async () => {
    if (!(await askConfirm(`“${p.name}” oʻchirilsinmi?`))) return;
    try { await store.remove(p.id, p.image_url); closeSheet(); toast("Oʻchirildi"); reload(); }
    catch(e){ toast("Xato: " + (e.message || e), 4000); }
  };
}

function openLogin(){
  return new Promise(resolve => {
    let ok = false;
    openSheet(`
      <h2>Admin sifatida kirish</h2>
      <p class="note">Supabase'da yaratgan admin email va parolingiz. Bir marta kirsangiz, shu qurilmada eslab qolinadi.</p>
      <div class="field"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username"></div>
      <div class="field"><label for="lPass">Parol</label><input id="lPass" type="password" autocomplete="current-password"></div>
      <div class="row"><button class="btn primary" id="lGo">Kirish</button></div>
    `, () => resolve(ok));
    $("#lGo").onclick = async () => {
      const b = $("#lGo"); b.disabled = true; b.textContent = "Tekshirilmoqda…";
      const { error } = await sb.auth.signInWithPassword({ email: $("#lEmail").value.trim(), password: $("#lPass").value });
      if (error){ b.disabled = false; b.textContent = "Kirish"; return toast("Email yoki parol notoʻgʻri"); }
      ok = true; closeSheet();
    };
  });
}

/* ---------------- Hodisalar ---------------- */
$("#grid").addEventListener("click", e => {
  const editId = e.target.closest("[data-edit]")?.dataset.edit;
  if (editId){ e.stopPropagation(); const p = products.find(x => String(x.id) === editId); return p && startEdit(p); }
  const id = e.target.closest(".card")?.dataset.id;
  if (id){ haptic(); const p = products.find(x => String(x.id) === id); p && openDetail(p); }
});
$("#chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  activeCat = c.dataset.cat; haptic(); render();
});
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
$("#fab").onclick = () => { haptic(); startEdit(null); };
$("#tgLink").onclick = e => { e.preventDefault(); openChat(); };
$("#phoneLink").href = "tel:" + CONFIG.PHONE;

/* ---------------- Ishga tushirish ---------------- */
(async function start(){
  document.title = CONFIG.SHOP_NAME + " — Katalog";
  $("#shopName").textContent = CONFIG.SHOP_NAME;
  if (IS_ADMIN){ $("#fab").hidden = false; }
  const badge = $("#modeBadge");
  if (DEMO){ badge.hidden = false; badge.textContent = IS_ADMIN ? "DEMO · Admin" : "DEMO"; }
  else if (IS_ADMIN){ badge.hidden = false; badge.textContent = "Admin"; }
  if (!DEMO){
    try { await store.init(); }
    catch(e){
      console.error(e);
      store.initError = e.message || String(e);
      $("#grid").innerHTML = "";
      const empty = $("#empty"); empty.hidden = false;
      empty.innerHTML = `⚠️ Bazaga ulanib boʻlmadi<br><small>${esc(store.initError)}</small>`;
      return;
    }
  }
  reload();
})();
</script>
